[project]
name = "procurepilot-api"
version = "0.2.0"
description = "AI-assisted procurement API with signed PayPal Sandbox checkout"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "python-jose[cryptography]>=3.3,<4",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "google-adk>=1.0,<3",
    "litellm==1.84.0",
    "redis>=5.0,<7",
    "reportlab>=4.2,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
